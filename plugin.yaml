name: hermes-subagent-output-guide
version: 0.1.0
description: "Injects text-report delivery guidance into subagent prompts — concise reports stay in the response, while long reports use the task-specified location or /tmp/. Uses subagent_start + pre_llm_call hooks to detect child sessions and inject context into their first turn."
author: "Shihfu Juan / Kuri"
hooks:
  - subagent_start
  - pre_llm_call
  - on_session_end
